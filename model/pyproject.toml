[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fontgen-model"
version = "0.1.0"
description = "Trainable prompt-to-Bezier typeface model for Fontgen Studio"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "fonttools>=4.59,<5",
  "numpy>=2.1,<3",
  "pillow>=11.1,<13",
  "pydantic>=2.10,<3",
  "torch>=2.6,<3",
  "scikit-image>=0.26,<1",
  "scipy>=1.14,<2",
  "tqdm>=4.67,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]
v5 = [
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "transformers>=4.51,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["fontgen_model"]

[tool.ruff]
line-length = 110
target-version = "py311"
